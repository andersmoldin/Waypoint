# Code and dependency scanning. Reporting and known limitations: SECURITY.md.
name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # New advisories and rules appear without any change in this repository.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  semgrep:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image is pinned in a Dockerfile because Dependabot cannot update a workflow's container.
      - run: docker build --tag semgrep .github/semgrep
      - run: >-
          docker run --rm --volume "${PWD}:/src" semgrep semgrep scan
          --metrics=off
          --error
          --config p/javascript
          --config p/typescript
          --config p/react
          --config p/github-actions
          --config p/secrets

  npm-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Audits the lockfile, so nothing is installed and no install script runs.
      # Everything in the bundle reaches the users' browsers: no advisory is accepted there.
      - name: Audit the dependencies that ship in the extension
        run: npm audit --omit=dev
      # Build tools only ever handle this repository's own files, so their lower advisories
      # are printed here without turning the job red.
      - name: Audit all dependencies, including the build tools
        run: npm audit --audit-level=high
