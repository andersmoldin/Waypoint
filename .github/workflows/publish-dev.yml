# Publishes the private waypoint-dev to the test organization on every merge to main,
# without any stored secret. Setup and fallback: docs/publicering.md.
name: Publish waypoint-dev

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-waypoint-dev
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build the vsix as YYYY.M.<run number + 100>
        id: version
        run: |
          # This repository's run numbers start at 1, but Marketplace needs a version above the
          # already published waypoint-dev 2026.11.15, so the offset keeps the versions rising.
          version="$(date -u +%Y.%-m).$((GITHUB_RUN_NUMBER + 100))"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          npm run build:web
          npm run package:dev -- --override "{\"version\":\"${version}\"}"
          scripts/verifyVsix.sh out/waypoint-dev.vsix waypoint-dev "${version}" private
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: waypoint-dev-vsix
          path: out/waypoint-dev.vsix
          if-no-files-found: error
          retention-days: 7

  # Separate from package so that the dependencies' install scripts and the build
  # never run in a job that can request an identity token.
  publish:
    needs: package
    runs-on: ubuntu-24.04
    environment: waypoint-dev
    # Upload and validation (at most 25 minutes).
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm cache here: the package job, which runs install scripts, could write to it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: waypoint-dev-vsix
          path: out
      # The Marketplace side of publishing, including why it never shares: docs/publicering.md.
      - run: scripts/publishToMarketplace.sh out/waypoint-dev.vsix "${VERSION}"
