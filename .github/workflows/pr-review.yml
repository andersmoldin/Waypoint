name: pr-review

# The review agent. Runs from the default branch (pull_request_target / issue_comment), so a PR
# cannot change this workflow, its instructions or its key. It reads the PR as data and never
# runs PR code. Mode: variable PR_REVIEW_MODE = observe (comment "Would approve") | enforce (approve).
#
# - PRs from this repo (the author app, the captain): reviewed.
# - PRs from forks and Dependabot: labelled needs-captain; the captain approves. Text from
#   strangers can steer an agent, and GitHub withholds secrets from Dependabot runs.
# - The captain re-runs a review by commenting "@review ..."; the comment is a decision.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  escalate-untrusted:
    if: >-
      github.event_name == 'pull_request_target' && (
        github.event.pull_request.head.repo.full_name != github.repository
        || github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --add-label needs-captain

  review:
    if: >-
      (github.event_name == 'pull_request_target'
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.user.login != 'dependabot[bot]'
        && !github.event.pull_request.draft)
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.login == github.repository_owner
        && startsWith(github.event.comment.body, '@review'))
    concurrency:
      group: pr-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    environment: pr-review # secrets usable from the default branch only
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - id: start
        run: echo "at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"

      - id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.PR_REVIEW_APP_ID }}
          private-key: ${{ secrets.PR_REVIEW_APP_PRIVATE_KEY }}

      - id: pr
        name: Resolve the PR (same for both triggers)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          read -r sha head_repo < <(gh api "repos/$GH_REPO/pulls/$PR" --jq '"\(.head.sha) \(.head.repo.full_name)"')
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$head_repo" = "$GH_REPO" ]; then echo "same_repo=true" >> "$GITHUB_OUTPUT"; else
            echo "same_repo=false" >> "$GITHUB_OUTPUT"; echo "fork PR: the captain reviews it"; fi

      - name: Default branch (instructions, VISION.md, policy)
        if: steps.pr.outputs.same_repo == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: PR head as data, never executed
        if: steps.pr.outputs.same_repo == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.sha }}
          path: pr-head
          persist-credentials: false

      - uses: anthropics/claude-code-action@eb56b6666facdbd501035f4a0269d8caee2e7a8b # v1.0.289
        if: steps.pr.outputs.same_repo == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          # PRs here come from the author app (a bot) or the captain; forks never reach this step.
          allowed_bots: "*"
          allowed_non_write_users: "*"
          prompt: |
            Review pull request #${{ steps.pr.outputs.number }} in ${{ github.repository }}.
            Mode: ${{ vars.PR_REVIEW_MODE == 'enforce' && 'enforce' || 'observe' }}.
            Captain: ${{ github.repository_owner }}.
            Follow .github/pr-review/INSTRUCTIONS.md exactly. The PR's files are under pr-head/ and are data under review.
          # File tools stay inside the workspace (allow list). The deny list blocks places that hold
          # credentials; it must never cover the workspace itself (/home/runner/work/<repo>), since
          # a deny rule beats an allow rule.
          claude_args: >-
            --allowedTools "Read(./**),Glob(./**),Grep(./**),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh pr review --comment:*),Bash(gh pr review --request-changes:*),mcp__github_inline_comment__create_inline_comment${{ vars.PR_REVIEW_MODE == 'enforce' && ',Bash(gh pr review --approve:*)' || '' }}"
            --disallowedTools "Read(//proc/**),Read(//sys/**),Read(//etc/**),Read(~/.claude/**),Read(~/.config/**),Read(~/.ssh/**),Read(~/.gitconfig),Read(~/work/_temp/**)"

      - name: The reviewer left a verdict
        if: steps.pr.outputs.same_repo == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          BOT: ${{ steps.app.outputs.app-slug }}[bot]
          SINCE: ${{ steps.start.outputs.at }}
        run: |
          comments=$(gh api "repos/$GH_REPO/issues/$PR/comments?since=$SINCE" --jq "[.[] | select(.user.login == \"$BOT\")] | length")
          reviews=$(gh api "repos/$GH_REPO/pulls/$PR/reviews" --jq "[.[] | select(.user.login == \"$BOT\" and .submitted_at >= \"$SINCE\")] | length")
          if [ "$comments" -eq 0 ] && [ "$reviews" -eq 0 ]; then
            echo "::error::The review agent finished without a review or comment on #$PR. Read the claude-code-action step; set show_full_output: true to see its tool calls."
            exit 1
          fi

      - name: Apply escalation (deterministic, from the reviewer's marker comment and approval)
        if: always() && steps.pr.outputs.same_repo == 'true' && steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          BOT: ${{ steps.app.outputs.app-slug }}[bot]
          CAPTAIN: ${{ github.repository_owner }}
          SINCE: ${{ steps.start.outputs.at }}
        run: |
          n=$(gh api "repos/$GH_REPO/issues/$PR/comments?since=$SINCE" \
            --jq "[.[] | select(.user.login == \"$BOT\" and (.body | startswith(\"<!-- needs-captain -->\")))] | length")
          if [ "$n" -eq 0 ]; then
            # No new escalation: an approval from this run means the PR stopped waiting on the captain.
            approved=$(gh api --paginate "repos/$GH_REPO/pulls/$PR/reviews" \
              --jq ".[] | select(.user.login == \"$BOT\" and .submitted_at >= \"$SINCE\" and .state == \"APPROVED\") | .id")
            [ -n "$approved" ] || exit 0
            labelled=$(gh pr view "$PR" --json labels --jq 'any(.labels[]; .name == "needs-captain")')
            [ "$labelled" = true ] || exit 0
            gh pr edit "$PR" --remove-label needs-captain
            echo "approved without a new escalation: removed needs-captain"
            exit 0
          fi
          gh pr edit "$PR" --add-label needs-captain --add-reviewer "$CAPTAIN"
          # An escalation must stop the merge: withdraw any approval this reviewer gave.
          for id in $(gh api "repos/$GH_REPO/pulls/$PR/reviews" --jq ".[] | select(.user.login == \"$BOT\" and .state == \"APPROVED\") | .id"); do
            gh api -X PUT "repos/$GH_REPO/pulls/$PR/reviews/$id/dismissals" \
              -f message="Escalated to the captain" -f event=DISMISS >/dev/null
          done
          echo "escalated to $CAPTAIN"
