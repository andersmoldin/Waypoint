# Publishes the public waypoint when a tag vYYYY.M.N is pushed and the owner approves it in the
# environment marketplace, without any stored secret. Steps and setup: docs/publicering.md.
name: Publish waypoint

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-waypoint
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Take the version from the tag
        id: version
        run: |
          version="$(node --no-warnings scripts/versionFromTag.ts "${GITHUB_REF_NAME}")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - run: scripts/releaseGate.sh
        env:
          GH_TOKEN: ${{ github.token }}

  package:
    needs: gate
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # No npm cache in a release: the cache is not signed, and a run on main writes to it.
      - run: npm ci
      - name: Build the vsix with the tag's version
        id: package
        run: |
          npm run build:web
          npm run package:public -- --override "{\"version\":\"${VERSION}\"}"
          scripts/verifyVsix.sh out/waypoint.vsix andersmoldin waypoint "${VERSION}" public
          sha256="$(sha256sum out/waypoint.vsix | cut --delimiter=' ' --fields=1)"
          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"
          # What the owner approves, on the page of the run.
          echo "Approving publishes ${VERSION} from ${GITHUB_SHA}, a vsix with SHA-256 ${sha256}." >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: waypoint-vsix
          path: out/waypoint.vsix
          if-no-files-found: error
          retention-days: 7

  # Separate from package so that the dependencies and the build never run in a job that
  # can request an identity token. No Node and no npm package runs here. The Trusted Publishing
  # policy only accepts this environment, and the environment waits for the owner's approval.
  publish:
    needs: [gate, package]
    runs-on: ubuntu-24.04
    environment: marketplace
    # Upload and validation (at most 25 minutes).
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      SHA256: ${{ needs.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: waypoint-vsix
          path: out
      # Checked again from this job's own checkout before any credential exists, since the job above runs the build.
      - name: Check the vsix
        run: |
          echo "${SHA256}  out/waypoint.vsix" | sha256sum --check --strict
          scripts/verifyVsix.sh out/waypoint.vsix andersmoldin waypoint "${VERSION}" public
      - run: scripts/publishToMarketplace.sh out/waypoint.vsix andersmoldin waypoint "${VERSION}"
