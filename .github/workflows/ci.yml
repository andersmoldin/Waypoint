name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # The job names are the required status checks on main: lint, test, build and browser. See docs/publicering.md.
    name: ${{ matrix.task }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        task: [lint, test, build, browser]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.task }}
